<style>

    display: grid; gap: 16px;

  .card svg { width: 140px; height: 140px; }

    font-size: 12px; padding: 2px 10px; margin: 10px 0 6px;
  }
  .name { font-size: 17px; font-weight: 600; }
  .desc { color: #8b93a7; font-size: 12px; line-height: 1.6; margin-top: 6px; }
