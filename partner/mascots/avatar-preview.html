<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner 形象 · 鲸鱼娘长大版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115; color: #e8eaf0;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #8b93a7; font-size: 13px; margin-bottom: 28px; }
  .big {
    width: min(320px, 80vw); height: min(320px, 80vw);
    background: radial-gradient(circle at 50% 38%, #22304d, #171a21 72%);
    border: 1px solid #2a3040; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
  }
  .big img { width: 88%; height: 88%; }
  .row { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .small {
    width: 38px; height: 38px; border-radius: 50%;
    background: #171a21; border: 1px solid #2a3040;
    overflow: hidden;
  }
  .small img { width: 100%; height: 100%; }
  .note { color: #8b93a7; font-size: 12px; line-height: 1.8; text-align: center; max-width: 420px; }
</style>
</head>
<body>
<h1>Partner · 鲸鱼娘(长大版)</h1>
<div class="sub">蓝发女仆装 · 鲸鱼发卡 · 鲸鱼耳坠 · 温柔微笑</div>
<div class="big"><img src="../static/avatar.svg" alt="Partner 形象"></div>
<div class="row">
  <span style="font-size:13px;color:#8b93a7;">标题栏小头像预览:</span>
  <div class="small"><img src="../static/avatar.svg" alt="小头像"></div>
</div>
<div class="note">
  不满意的地方告诉我,比如:眼睛睁开 / 表情换一换 / 发型改侧马尾 / 女仆装换常服。<br>
  确定后,下一步可以让它动起来(眨眼、呼吸),并做成 PNG 用到别处。
</div>
</body>
</html>
