<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b93ff"/><stop offset="1" stop-color="#3a63c8"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/><stop offset="1" stop-color="#232d42"/>
    </linearGradient>
  </defs>

  <!-- 长发后层 -->
  <ellipse cx="100" cy="58" rx="48" ry="48" fill="url(#hair)"/>
  <path d="M56 96 q-14 56 4 94 q4 8 12 2 q10 -8 8 -34 q-3 -30 -2 -52 q0 -12 2 -16 z" fill="url(#hair)"/>
  <path d="M144 96 q14 56 -4 94 q-4 8 -12 2 q-10 -8 -8 -34 q3 -30 2 -52 q0 -12 -2 -16 z" fill="url(#hair)"/>
  <path d="M60 186 q-11 9 -17 5 q-4 -4 2 -12 z" fill="#3a63c8"/>
  <path d="M140 186 q11 9 17 5 q4 -4 -2 -12 z" fill="#3a63c8"/>

  <!-- 女仆装上身 -->
  <path d="M36 200 v-50 q0 -18 18 -18 h92 q18 0 18 18 v50 z" fill="url(#dress)"/>
  <!-- 白色围裙 -->
  <path d="M74 152 q0 -12 9 -15 h34 q9 3 9 15 v48 h-52 z" fill="#f4f7ff"/>
  <path d="M76 158 h48" stroke="#dbe4f5" stroke-width="3"/>
  <!-- 领口花边 -->
  <path d="M56 136 q44 -14 88 0 l-5 9 q-39 -11 -78 0 z" fill="#f4f7ff"/>
  <!-- 蝴蝶结 -->
  <path d="M93 141 l-13 -8 q-2 9 5 11 l8 -3 z" fill="#4d7fe8"/>
  <path d="M107 141 l13 -8 q2 9 -5 11 l-8 -3 z" fill="#4d7fe8"/>
  <circle cx="100" cy="139" r="5" fill="#2f56b3"/>

  <!-- 脖子 -->
  <rect x="89" y="112" width="22" height="26" rx="8" fill="#f0c8a4"/>

  <!-- 脸 -->
  <ellipse cx="100" cy="74" rx="33" ry="36" fill="#ffe4cf"/>

  <!-- 刘海与侧发 -->
  <path d="M66 64 q-6 -38 34 -38 q32 0 37 32 q-9 -24 -36 -21 q-28 2 -35 27 z" fill="url(#hair)"/>
  <path d="M64 68 q-9 17 -3 36 q2 6 7 2 q5 -4 3 -15 q-2 -12 2 -21 z" fill="#5b93ff"/>

  <!-- 眉毛 -->
  <path d="M72 63 q7 -5 14 -2" stroke="#2f56b3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M114 61 q7 -3 14 2" stroke="#2f56b3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 眼睛:温柔弯月 + 睫毛 -->
  <path d="M74 79 q7 -8 14 0" stroke="#2c3e5c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M112 79 q7 -8 14 0" stroke="#2c3e5c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M74 79 l-5 -3 M88 77 l5 -3" stroke="#2c3e5c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M126 79 l5 -3 M112 77 l-5 -3" stroke="#2c3e5c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 鼻子 -->
  <path d="M100 88 q2 3 0 5" stroke="#e8b895" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 嘴 -->
  <path d="M91 99 q9 8 18 0" stroke="#c25b5b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="74" cy="93" rx="8" ry="4.5" fill="#ffb3c4" opacity=".55"/>
  <ellipse cx="126" cy="93" rx="8" ry="4.5" fill="#ffb3c4" opacity=".55"/>

  <!-- 头发高光 -->
  <path d="M84 32 q6 -11 17 -9" stroke="#9cc4ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M110 24 q11 -2 17 4" stroke="#9cc4ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>

  <!-- 鲸鱼发卡 -->
  <g transform="translate(137 33) scale(.9)">
    <ellipse cx="0" cy="0" rx="15" ry="11" fill="#9cc4ff"/>
    <path d="M12 -3 q6 -6 8 -13 q-7 5 -11 4 z" fill="#9cc4ff"/>
    <circle cx="-7" cy="-2" r="2" fill="#16233f"/>
    <circle cx="8" cy="-12" r="1.6" fill="#fff" opacity=".85"/>
  </g>

  <!-- 鲸鱼耳坠 -->
  <g transform="translate(65 86)">
    <line x1="0" y1="-9" x2="0" y2="2" stroke="#2f56b3" stroke-width="2"/>
    <ellipse cx="0" cy="9" rx="7" ry="5" fill="#9cc4ff"/>
    <path d="M5.5 7 q3 -3 4 -6 q-3 2 -5 2 z" fill="#9cc4ff"/>
    <circle cx="-3" cy="8" r="1" fill="#16233f"/>
  </g>
</svg>
